# Generated values live only in the secret-store namespace.
# Run from the upstream checkout with:
#   uv run ci/create-ci-secrets.py --context default --config \
#     "$HOME/k8tre-lifecycle/ci/ci-secrets.yaml"
environment: ci
namespace: secret-store

secrets:
  - name: lifecycle-db-secret
    type: generic
    data:
      - key: username
        value: "lifecycle-user"
      - key: password
        value: "{{ generate_password(32) }}"
      - key: database
        value: "lifecycle"

  - name: lifecycle-internal-token
    type: generic
    data:
      - key: token
        value: "{{ generate_hex_key(32) }}"

  # The extended portal keeps its Keycloak session cookies signed with a value
  # generated in secret-store, never committed to Git.
  - name: backend-session-secret
    type: generic
    data:
      - key: session_secret
        value: "{{ generate_hex_key(32) }}"
      - key: auth_sig_secret
        value: "{{ generate_hex_key(32) }}"
