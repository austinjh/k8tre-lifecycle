apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lifecycle-db-secret
  namespace: lifecycle
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: lifecycle-db-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: lifecycle-db-secret
        property: username
    - secretKey: password
      remoteRef:
        key: lifecycle-db-secret
        property: password
    - secretKey: database
      remoteRef:
        key: lifecycle-db-secret
        property: database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lifecycle-api-credentials
  namespace: lifecycle
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: lifecycle-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: lifecycle-internal-token
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lifecycle-s3-credentials
  namespace: lifecycle
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: lifecycle-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: seaweedfs-s3-credentials
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: seaweedfs-s3-credentials
        property: secret-key
