name: Build lifecycle-core

on:
  push:
    branches:
      - main
    paths:
      - "services/lifecycle-core/**"
      - ".github/workflows/lifecycle-core.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/lifecycle-core
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/lifecycle-core:v0.1.0
            ghcr.io/${{ github.repository }}/lifecycle-core:${{ github.sha }}
