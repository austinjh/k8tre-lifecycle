apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-oidc-credentials
  namespace: backend
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: backend-oidc-credentials
    template:
      type: Opaque
  data:
    - secretKey: client-id
      remoteRef:
        key: backend-oidc-client
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: backend-oidc-client
        property: client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guacamole-json-secret
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: guacamole-json-secret
  data:
    - secretKey: GUACAMOLE_JSON_SECRET_KEY
      remoteRef:
        key: guacamole-json-secret
        property: GUACAMOLE_JSON_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lifecycle-api-credentials
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: lifecycle-api-credentials
  data:
    - secretKey: token
      remoteRef:
        key: lifecycle-internal-token
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-session-secret
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: backend-session-secret
  data:
    - secretKey: session_secret
      remoteRef:
        key: backend-session-secret
        property: session_secret
    - secretKey: auth_sig_secret
      remoteRef:
        key: backend-session-secret
        property: auth_sig_secret
